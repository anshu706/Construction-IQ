name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (lint · test · build · audit)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: constructiq_test
          POSTGRES_USER: constructiq
          POSTGRES_PASSWORD: test_password_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U constructiq -d constructiq_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://constructiq:test_password_ci_only@localhost:5432/constructiq_test
      SESSION_SECRET: ci-session-secret-at-least-32-chars-long
      DEMO_MODE: "false"
      NVIDIA_API_KEY: ""
      GEMINI_API_KEY: ""
      UPLOAD_DIR: /tmp/constructiq-uploads

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Lint (tsc --noEmit)
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit (high + critical)
        run: npm audit --audit-level=high

  container:
    name: Container (build · hadolint · trivy)
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          tags: constructiq:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: constructiq:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

